name: Fetch app icons
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # weekly
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps (none needed)
        run: echo "ok"
      - name: Run fetcher
        run: node scripts/fetch-icons.mjs
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/apps/*.png || true
          git commit -m "chore(icons): update app icons" || echo "No changes"
          git push
